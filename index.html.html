<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vs School · SMK MERBAU</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--panel:rgba(18,32,64,.72);--line:rgba(90,140,220,.22);--text:#e8f1ff;--muted:#8fa6c8;--dim:#5f7a9e;--accent:#2f7bff;--accent2:#22d3ee}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#050b1a;color:var(--text);line-height:1.6;font-size:15px;min-height:100vh}
body::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(900px 600px at 10% -10%,rgba(47,123,255,.18),transparent 60%),radial-gradient(700px 500px at 100% 0%,rgba(34,211,238,.10),transparent 55%),linear-gradient(160deg,#050b1a,#081326 55%,#050b1a)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:15px}
.screen{display:none;min-height:100vh}.screen.active{display:block}
#scr-splash{display:none;place-items:center;min-height:100vh;text-align:center}
#scr-splash.active{display:grid}
.splash-logo{font-size:64px;animation:pop .8s}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.splash-title{font-size:44px;font-weight:800;letter-spacing:-1.5px;margin:10px 0 0;background:linear-gradient(120deg,#fff,#7fb0ff 60%,#22d3ee);-webkit-background-clip:text;background-clip:text;color:transparent}
.splash-sub{font-size:13px;letter-spacing:4px;color:var(--accent2);margin-top:6px;font-weight:700}
.splash-cn{font-size:17px;color:#9fc5ff;margin-top:6px}
.splash-school{font-size:12px;letter-spacing:2px;color:var(--muted);margin-top:22px;padding:6px 14px;border:1px solid var(--line);border-radius:99px;display:inline-block}
.spinner{width:30px;height:30px;border:3px solid rgba(90,140,220,.2);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;margin:34px auto 0}
@keyframes spin{to{transform:rotate(360deg)}}
.splash-studio{font-size:11px;color:var(--dim);letter-spacing:2px;margin-top:16px}
.auth-lang{position:fixed;top:14px;right:14px;z-index:50;display:flex;gap:5px;background:rgba(8,18,38,.8);padding:4px;border-radius:11px;border:1px solid var(--line);backdrop-filter:blur(12px)}
.auth-lang button{padding:7px 12px;border-radius:8px;font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}
.auth-lang button.on{background:linear-gradient(135deg,rgba(47,123,255,.35),rgba(34,211,238,.2));color:#fff}
.auth-wrap{display:flex;min-height:100vh;max-width:1200px;margin:0 auto}
.auth-brand{flex:1;padding:60px 48px;display:flex;flex-direction:column;justify-content:center}
.auth-brand .b-logo{font-size:52px}
.auth-brand h1{font-size:40px;font-weight:800;letter-spacing:-1.5px;margin:12px 0 0;background:linear-gradient(120deg,#fff,#7fb0ff 60%,#22d3ee);-webkit-background-clip:text;background-clip:text;color:transparent}
.auth-brand .b-sub{font-size:12px;letter-spacing:3px;color:var(--accent2);font-weight:700;margin-top:4px}
.auth-brand .b-cn{font-size:16px;color:#9fc5ff;margin-top:6px}
.auth-brand ul{list-style:none;padding:0;margin:32px 0 0}
.auth-brand li{padding:13px 0;border-bottom:1px solid var(--line);color:#c3d4ec;font-size:14px;display:flex;gap:10px;align-items:flex-start}
.auth-brand li::before{content:'▸';color:var(--accent2);font-weight:800}
.auth-form{flex:1;padding:60px 48px;display:flex;flex-direction:column;justify-content:center;max-width:520px;margin:0 auto;width:100%}
.auth-card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:28px;backdrop-filter:blur(14px)}
.auth-tabs{display:flex;gap:6px;background:rgba(8,18,38,.7);padding:5px;border-radius:12px;margin-bottom:22px}
.auth-tabs button{flex:1;padding:10px;border-radius:9px;font-size:14px;font-weight:700;color:var(--muted)}
.auth-tabs button.on{background:linear-gradient(135deg,#2f7bff,#22d3ee);color:#fff;box-shadow:0 4px 14px rgba(47,123,255,.35)}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:12px 14px;border-radius:12px;background:rgba(8,18,38,.85);border:1px solid var(--line);color:var(--text);outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(47,123,255,.18)}
.field textarea{resize:vertical;min-height:96px}
.btn{padding:13px 20px;border-radius:12px;font-size:14.5px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:.18s}
.btn-primary{background:linear-gradient(135deg,#2f7bff,#22d3ee);color:#fff;box-shadow:0 6px 20px rgba(47,123,255,.3)}
.btn-primary:hover{filter:brightness(1.1);transform:translateY(-1px)}
.btn-ghost{background:rgba(90,140,220,.1);border:1px solid var(--line);color:var(--text)}
.btn-ghost:hover{background:rgba(90,140,220,.2)}
.btn-full{width:100%}
.verify-box{background:rgba(8,18,38,.7);border:1px dashed rgba(90,140,220,.35);border-radius:12px;padding:14px;margin-bottom:14px}
.verify-box .v-title{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:8px}
.verify-box .v-row{display:flex;gap:10px;align-items:center}
.verify-box .v-q{flex:1;font-size:16px;font-weight:800;color:var(--accent2);background:rgba(34,211,238,.08);padding:9px 12px;border-radius:9px;text-align:center}
.verify-box input{width:90px;text-align:center;font-weight:800}
.err{font-size:12.5px;color:#ff8fa3;margin-top:8px;min-height:17px}
.hint{font-size:11.5px;color:var(--dim);margin-top:14px;line-height:1.6;text-align:center}
.role-pick{display:flex;gap:10px}
.role-pick button{flex:1;padding:14px 10px;border-radius:12px;border:1px solid var(--line);background:rgba(8,18,38,.6);font-size:13.5px;font-weight:700;color:var(--muted)}
.role-pick button.on{border-color:var(--accent);background:rgba(47,123,255,.16);color:#fff}
.role-pick button:disabled{opacity:.35;cursor:not-allowed}
.role-pick .sub{display:block;font-size:10.5px;font-weight:500;margin-top:3px;color:var(--dim)}
.appbar{position:sticky;top:0;z-index:40;height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:rgba(6,14,30,.86);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.appbar-left{display:flex;align-items:center;gap:11px}
.appbar-left .logo{font-size:23px}
.app-name{font-size:15.5px;font-weight:800;line-height:1.15}
.app-school{font-size:10px;letter-spacing:1.6px;color:var(--dim);font-weight:700}
.appbar-right{display:flex;align-items:center;gap:9px}
.lang-mini{display:flex;gap:3px;background:rgba(8,18,38,.7);padding:3px;border-radius:9px;border:1px solid var(--line)}
.lang-mini button{padding:5px 9px;border-radius:7px;font-size:11px;font-weight:700;color:var(--muted)}
.lang-mini button.on{background:rgba(47,123,255,.3);color:#fff}
.user-chip{display:flex;align-items:center;gap:7px;padding:6px 12px;border-radius:99px;background:rgba(47,123,255,.12);border:1px solid rgba(47,123,255,.3);font-size:12.5px;font-weight:700;max-width:180px}
.user-chip .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.user-chip .rl{font-size:10px;padding:1px 7px;border-radius:99px;background:rgba(34,211,238,.2);color:#7fe7f7;flex-shrink:0}
.icon-btn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:rgba(90,140,220,.1);border:1px solid var(--line);font-size:15px}
.icon-btn:hover{background:rgba(90,140,220,.24)}
.app-body{display:flex;min-height:calc(100vh - 60px)}
.appnav{width:222px;flex-shrink:0;padding:16px 12px;border-right:1px solid var(--line);background:rgba(6,14,30,.45)}
.appnav a{display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:11px;color:#a9bdd8;text-decoration:none;font-size:13.5px;font-weight:600;margin-bottom:3px;cursor:pointer;border:1px solid transparent}
.appnav a:hover{background:rgba(90,140,220,.12);color:#fff}
.appnav a.on{background:linear-gradient(135deg,rgba(47,123,255,.28),rgba(34,211,238,.14));color:#fff;border-color:rgba(47,123,255,.4)}
.appmain{flex:1;padding:26px 30px;max-width:1080px;min-width:0}
@media(max-width:800px){.app-body{flex-direction:column}.appnav{width:100%;display:flex;overflow-x:auto;gap:6px;padding:10px;border-right:none;border-bottom:1px solid var(--line)}.appnav a{white-space:nowrap;margin:0;padding:9px 13px;font-size:12.5px}.appmain{padding:18px 15px}.app-school{display:none}.user-chip{max-width:120px}.auth-brand{display:none}.auth-form{padding:80px 20px 40px;max-width:100%}}
.page-title{font-size:25px;font-weight:800;letter-spacing:-.6px;margin:0 0 4px}
.page-sub{font-size:13px;color:var(--muted);margin:0 0 22px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;backdrop-filter:blur(10px);margin-bottom:14px}
.card h3{margin:0 0 12px;font-size:15px;font-weight:800;color:#cfe0ff}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;backdrop-filter:blur(10px)}
.stat .n{font-size:30px;font-weight:800;letter-spacing:-1px;line-height:1.1}
.stat .l{font-size:11.5px;color:var(--muted);margin-top:5px;font-weight:600}
.stat.blue .n{color:#7fb0ff}.stat.yellow .n{color:#ffc76b}.stat.green .n{color:#66e29a}.stat.red .n{color:#ff8fa3}
.hero{background:linear-gradient(135deg,rgba(47,123,255,.2),rgba(34,211,238,.08));border:1px solid rgba(47,123,255,.3);border-radius:18px;padding:22px;margin-bottom:18px}
.hero h2{margin:0 0 6px;font-size:20px;font-weight:800}
.hero p{margin:0 0 14px;font-size:13.5px;color:#c3d4ec}
.quick{display:flex;gap:9px;flex-wrap:wrap}
.quick button{padding:10px 16px;border-radius:11px;font-size:13px;font-weight:700;background:rgba(8,18,38,.7);border:1px solid var(--line)}
.quick button:hover{border-color:var(--accent);background:rgba(47,123,255,.15)}
.badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:700}
.badge.pending{background:rgba(255,176,32,.18);color:#ffc76b}
.badge.review{background:rgba(47,123,255,.2);color:#7fb0ff}
.badge.resolved{background:rgba(34,197,94,.18);color:#66e29a}
.badge.closed{background:rgba(143,166,200,.18);color:#a9bdd8}
.badge.low{background:rgba(34,197,94,.16);color:#66e29a}
.badge.mid{background:rgba(255,176,32,.16);color:#ffc76b}
.badge.high{background:rgba(255,84,112,.18);color:#ff8fa3}
.badge.critical{background:rgba(255,84,112,.3);color:#ffb3c1}
.badge.info{background:rgba(34,211,238,.18);color:#7fe7f7}
.empty{text-align:center;padding:44px 20px;color:var(--dim);font-size:13.5px}
.empty .ic{font-size:42px;display:block;margin-bottom:12px;opacity:.5}
.list-item{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px;margin-bottom:11px;cursor:pointer;transition:.16s}
.list-item:hover{border-color:rgba(47,123,255,.45);transform:translateY(-1px)}
.li-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.li-code{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--accent2);font-weight:700}
.li-desc{font-size:13.5px;color:#c3d4ec;margin-bottom:8px;line-height:1.6}
.li-meta{font-size:11.5px;color:var(--dim);display:flex;gap:14px;flex-wrap:wrap}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.row{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:10px 12px;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;border-bottom:1px solid var(--line);background:rgba(8,18,38,.6)}
td{padding:11px 12px;border-bottom:1px solid rgba(90,140,220,.09);color:#c3d4ec}
tr:last-child td{border-bottom:none}
tbody tr:hover td{background:rgba(47,123,255,.05)}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
.chat-wrap{display:flex;flex-direction:column;height:calc(100vh - 190px);min-height:400px;background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.chat-head{padding:14px 18px;border-bottom:1px solid var(--line);background:rgba(8,18,38,.6);display:flex;justify-content:space-between;align-items:center}
.chat-head h3{margin:0;font-size:15px;font-weight:800}
.chat-head p{margin:3px 0 0;font-size:12px;color:var(--muted)}
.chat-badge{font-size:10px;padding:3px 8px;border-radius:99px;background:rgba(34,211,238,.15);color:#7fe7f7;font-weight:700}
.chat-body{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:82%;padding:12px 15px;border-radius:16px;font-size:14px;line-height:1.65;white-space:pre-wrap;word-break:break-word}
.msg.ai{align-self:flex-start;background:rgba(47,123,255,.13);border:1px solid rgba(47,123,255,.25);border-bottom-left-radius:5px}
.msg.me{align-self:flex-end;background:linear-gradient(135deg,rgba(47,123,255,.9),rgba(34,211,238,.75));color:#fff;border-bottom-right-radius:5px}
.msg.crisis{align-self:flex-start;background:rgba(255,84,112,.16);border:1px solid rgba(255,84,112,.5);border-bottom-left-radius:5px;color:#ffd5dd}
.chat-input{display:flex;gap:9px;padding:13px;border-top:1px solid var(--line);background:rgba(8,18,38,.6)}
.chat-input input{flex:1;padding:12px 15px;border-radius:12px;background:rgba(8,18,38,.9);border:1px solid var(--line);color:var(--text);outline:none}
.chat-input input:focus{border-color:var(--accent)}
.chat-input button{padding:0 20px;border-radius:12px;background:linear-gradient(135deg,#2f7bff,#22d3ee);color:#fff;font-weight:700;font-size:14px}
.typing{align-self:flex-start;padding:12px 18px;color:var(--muted);font-size:13px;letter-spacing:3px}
.suggest{display:flex;gap:7px;flex-wrap:wrap;padding:0 13px 13px}
.suggest button{padding:7px 13px;border-radius:99px;font-size:12px;background:rgba(90,140,220,.1);border:1px solid var(--line);color:#a9bdd8}
.suggest button:hover{border-color:var(--accent);color:#fff}
.modal{position:fixed;inset:0;background:rgba(3,7,16,.78);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:200;padding:18px}
.modal.on{display:flex}
.modal-box{background:#0d1a33;border:1px solid var(--line);border-radius:18px;padding:24px;max-width:600px;width:100%;max-height:88vh;overflow-y:auto}
.modal-box h2{margin:0 0 6px;font-size:20px;font-weight:800}
.modal-close{position:absolute;top:14px;right:14px}
.test-prog{height:6px;background:rgba(90,140,220,.15);border-radius:99px;overflow:hidden;margin-bottom:8px}
.test-prog i{display:block;height:100%;background:linear-gradient(90deg,#2f7bff,#22d3ee);transition:width .35s;border-radius:99px}
.opt{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:13px;background:rgba(8,18,38,.7);border:1px solid var(--line);margin-bottom:9px;cursor:pointer;font-size:14px}
.opt:hover{border-color:rgba(47,123,255,.5);background:rgba(47,123,255,.08)}
.opt.on{border-color:var(--accent);background:rgba(47,123,255,.18);font-weight:700}
.opt .dot{width:20px;height:20px;border-radius:50%;border:2px solid rgba(90,140,220,.5);flex-shrink:0}
.opt.on .dot{border-color:var(--accent);background:var(--accent);box-shadow:inset 0 0 0 3px #0d1a33}
.dim-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid rgba(90,140,220,.08)}
.dim-row:last-child{border-bottom:none}
.dim-name{flex:1;font-size:13.5px}
.dim-bar{width:64px;height:7px;background:rgba(90,140,220,.15);border-radius:99px;overflow:hidden;flex-shrink:0}
.dim-bar i{display:block;height:100%;border-radius:99px}
.score-card{border-radius:18px;padding:24px;margin-bottom:18px}
.score-big{font-size:46px;font-weight:800;letter-spacing:-2px;line-height:1}
.score-big small{font-size:18px;color:rgba(255,255,255,.45);font-weight:600}
.lock-card{text-align:center;padding:36px 26px;max-width:460px;margin:40px auto}
.lock-card .ic{font-size:48px;margin-bottom:14px;animation:breathe 3s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.7}50%{opacity:1}}
.countdown{font-size:26px;font-weight:800;font-family:ui-monospace,Menlo,monospace;color:var(--accent);margin:12px 0}
</style>
</head>
<body>

<div class="screen active" id="scr-splash">
  <div>
    <div class="splash-logo">🛡️</div>
    <h1 class="splash-title">Vs School</h1>
    <div class="splash-sub">VIGILANCE &amp; SAFETY</div>
    <div class="splash-cn">守护平安校园</div>
    <div class="splash-school">SMK MERBAU</div>
    <div class="spinner"></div>
    <div class="splash-studio">WG STUDIO</div>
  </div>
</div>

<div class="screen" id="scr-auth">
  <div class="auth-lang" id="authLang"></div>
  <div class="auth-wrap">
    <div class="auth-brand">
      <div class="b-logo">🛡️</div>
      <h1>Vs School</h1>
      <div class="b-sub">VIGILANCE &amp; SAFETY</div>
      <div class="b-cn">守护平安校园</div>
      <ul id="brandList"></ul>
    </div>
    <div class="auth-form">
      <div class="auth-card">
        <div class="auth-tabs" id="authTabs"></div>
        <div id="authBody"></div>
      </div>
    </div>
  </div>
</div>

<div class="screen" id="scr-app">
  <header class="appbar">
    <div class="appbar-left">
      <span class="logo">🛡️</span>
      <div>
        <div class="app-name">Vs School</div>
        <div class="app-school">SMK MERBAU</div>
      </div>
    </div>
    <div class="appbar-right">
      <div class="lang-mini" id="langMini"></div>
      <div class="user-chip">
        <span class="nm" id="chipName"></span>
        <span class="rl" id="chipRole"></span>
      </div>
      <button class="icon-btn" id="btnLogout" title="Logout">⏻</button>
    </div>
  </header>
  <div class="app-body">
    <aside class="appnav" id="appnav"></aside>
    <main class="appmain" id="appmain"></main>
  </div>
</div>

<div class="modal" id="modal">
  <div class="modal-box" style="position:relative" id="modalBox"></div>
</div>

function detectTopic(text){const s=String(text||'').toLowerCase();let best=null,bs=0;for(const tp of AI_TOPICS){let sc=0;for(const kw of tp.kw){if(s.includes(kw.toLowerCase()))sc+=kw.length>3?2:1.2;}if(sc>bs){bs=sc;best=tp;}}return bs>=1.2?best:null;}

async function aiRespond(text){
  const tp = detectTopic(text);
  try{
    const history = state.chat.filter(m => !(m.role==='ai' && m.text===t('chatWelcome'))).map(m => ({ role: m.role==='me' ? 'user' : 'assistant', content: m.text }));
    history.push({ role:'user', content: text });
    const { data, error } = await sb.functions.invoke('bright-responder', { body: { messages: history, lang: state.lang } });
    if(error) throw error;
    const reply = (typeof data === 'string' ? JSON.parse(data) : data)?.reply;
    if(!reply) throw new Error('Empty reply');
    state.aiOnline = true;
    return { text: reply, risk: tp?.risk ?? 0 };
  } catch(e){
    console.error('ai-chat failed:', e);
    state.aiOnline = false;
    if(!tp) return { text: t('aiOnly'), risk: 0 };
    return { text: localReply(tp), risk: tp.risk };
  }
}

},hope:{zh:'最近两周，你觉得未来没希望的频率是？',en:'How often did the future feel hopeless?',ms:'Berapa kerap masa depan tiada harapan?'},relaxation:{zh:'最近两周，你无法放松的频率是？',en:'How often were you unable to relax?',ms:'Berapa kerap anda tidak boleh relaks?'},help_seeking:{zh:'最近两周，你不愿求助的频率是？',en:'How often did you avoid asking for help?',ms:'Berapa kerap anda elak minta bantuan?'}};
function generateTestLocal(){
  const opts = state.lang==='zh'?['完全没有','偶尔','经常','几乎每天']:state.lang==='ms'?['Langsung tidak','Kadang','Kerap','Hampir setiap hari']:['Not at all','Sometimes','Often','Almost every day'];
  const qs = DIM_ORDER.map(d=>({id:'q_'+d, dim:d, name: DIM_NAMES[d][state.lang==='zh'?0:state.lang==='ms'?2:1], q: LOCAL_Q[d][state.lang] || LOCAL_Q[d].en, opts}));
  for(let i=qs.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[qs[i],qs[j]]=[qs[j],qs[i]];}
  return qs;
}
function analyzeTest(qs, ans){
  const dims = qs.map((q,i)=>({dim:q.dim,name:q.name,score:ans[i]||0,max:3}));
  const total = dims.reduce((a,b)=>a+b.score,0);
  let level,label;
  if(total<=15){level='good';label=state.lang==='zh'?'整体良好':state.lang==='ms'?'Keseluruhan baik':'Overall good';}
  else if(total<=30){level='moderate';label=state.lang==='zh'?'整体一般，有部分需要关注':state.lang==='ms'?'Biasa dengan beberapa kebimbangan':'Okay with some concerns';}
  else if(total<=45){level='low';label=state.lang==='zh'?'整体偏低，建议寻求支持':state.lang==='ms'?'Rendah — pertimbang sokongan':'Low — consider support';}
  else{level='high';label=state.lang==='zh'?'整体较低，请找人聊聊':state.lang==='ms'?'Sangat rendah — sila bercakap dengan seseorang':'Very low — please talk to someone';}
  dims.sort((a,b)=>b.score-a.score);
  return {total,max:60,level,label,dims,at:Date.now()};
}

async function doLogin(){
  const email = ($('liEmail').value||'').trim().toLowerCase();
  const pwd = $('liPwd').value||'';
  const vv = ($('verifyInput').value||'').trim();
  const err = $('authErr'); const show = m => err.textContent = m;
  if(!email) return show(t('errEmail'));
  if(!email.endsWith('@gmail.com')) return show(t('errGmail'));
  if(!pwd) return show(t('errPwd'));
  if(vv !== String(state.verify.a+state.verify.b)){ state.verify=newVerify(); renderAuth(); return setTimeout(()=>{$('authErr').textContent=t('verifyWrong');},10); }
  show('Signing in…');
  const {data, error} = await sb.auth.signInWithPassword({email, password:pwd});
  if(error) return show(t('errCred'));
  const {data:prof, error:pErr} = await sb.from('profiles').select('*').eq('id', data.user.id).single();
  if(pErr || !prof) return show('Profile not found. Contact admin.');
  state.user = {id:prof.id, name:prof.name, email:prof.email, role:prof.role, className:prof.class_name};
  await enterApp();
}
async function doRegister(){
  const name = ($('rgName').value||'').trim();
  const email = ($('rgEmail').value||'').trim().toLowerCase();
  const cls = ($('rgClass').value||'').trim();
  const pwd = $('rgPwd').value||'';
  const pwd2 = $('rgPwd2').value||'';
  const vv = ($('verifyInput').value||'').trim();
  const err = $('authErr'); const show = m => err.textContent = m;
  if(!name) return show(t('errName'));
  if(!email) return show(t('errEmail'));
  if(!email.endsWith('@gmail.com')) return show(t('errGmail'));
  if(!cls) return show(t('errClass'));
  if(pwd.length<8) return show(t('errPwdLen'));
  if(pwd!==pwd2) return show(t('errPwdMatch'));
  if(vv !== String(state.verify.a+state.verify.b)){ state.verify=newVerify(); renderAuth(); return setTimeout(()=>{$('authErr').textContent=t('verifyWrong');},10); }
  show('Creating account…');
  const {data, error} = await sb.auth.signUp({email, password:pwd, options:{data:{name, role:'student', class_name:cls}}});
  if(error){ if(error.message.toLowerCase().includes('already')) return show(t('errExists')); return show(error.message); }
  if(!data.user) return show('Sign up failed. Try again.');
  if(!data.session) return show('Registered. Please check your Gmail to confirm, then sign in.');
  const { error: pInsErr } = await sb.from('profiles').upsert({ id: data.user.id, email: email, name: name, role: 'student', class_name: cls }, { onConflict: 'id' });
  if(pInsErr) console.warn('profile upsert:', pInsErr);
  let { data: prof } = await sb.from('profiles').select('*').eq('id', data.user.id).maybeSingle();
  if(!prof){ await new Promise(r=>setTimeout(r, 600)); const retry = await sb.from('profiles').select('*').eq('id', data.user.id).maybeSingle(); prof = retry.data; }
  if(!prof) return show('Profile creation failed. Contact admin.');
  state.user = {id: prof.id, name: prof.name, email: prof.email, role: prof.role, className: prof.class_name};
  await enterApp();
}

  openModal(`<h2>${esc(r.code)}</h2><div style="margin:8px 0 16px"><span class="badge ${stClass(r.status)}">${t(ST_KEY[r.status])}</span><span class="badge ${sevClass(r.severity)}">${t(SV_KEY[r.severity])}</span><span class="badge info">${t(TYPE_KEY[r.type])}</span></div><div class="card"><div style="font-size:13px;color:var(--muted);margin-bottom:6px">${t('fDesc')}</div><div style="font-size:14px;white-space:pre-wrap">${esc(r.description||'')}</div><div style="margin-top:14px;font-size:12.5px;color:var(--dim);display:flex;gap:16px;flex-wrap:wrap">${r.people?`<span>👥 ${esc(r.people)}</span>`:''}${r.place?`<span>📍 ${esc(r.place)}</span>`:''}${r.count?`<span>#️⃣ ${esc(r.count)}</span>`:''}${r.class_name?`<span>🏫 ${esc(r.class_name)}</span>`:''}<span>🕒 ${new Date(r.created_at).toLocaleString()}</span>${r.anonymous?'<span>🕶️ Anonymous</span>':''}</div></div><div class="card"><h3>${t('timeline')}</h3>${tl}</div>${teacherCtl}${studentReply}<div style="display:flex;justify-content:flex-end;margin-top:16px"><button class="btn btn-ghost" onclick="closeModal()">${t('close')}</button></div>`);
  if(isTeacher){
    $('mdSave').onclick = async ()=>{ const s = $('mdStatus').value; const upd = {status:s, updated_at:new Date().toISOString()}; if(!r.assigned_name){ upd.assigned_name = state.user.name; } await sb.from('reports').update(upd).eq('id', id); if(s !== r.status) await sb.from('report_events').insert({report_id:id, type:'status', content:t(ST_KEY[s]), by_name:state.user.name}); if(!r.assigned_name) await sb.from('report_events').insert({report_id:id, type:'claimed', content:t('evClaimed'), by_name:state.user.name}); closeModal(); renderApp(); };
    $('mdSend').onclick = async ()=>{ const msg = ($('mdMsg').value||'').trim(); if(!msg) return; await sb.from('report_events').insert({report_id:id, type:'note', content:msg, by_name:state.user.name}); const upd = {updated_at:new Date().toISOString()}; if(r.status==='pending') upd.status='review'; if(!r.assigned_name) upd.assigned_name = state.user.name; await sb.from('reports').update(upd).eq('id', id); closeModal(); renderApp(); };
  }
  if(isOwner){
    $('stuSend').onclick = async ()=>{ const msg = ($('stuMsg').value||'').trim(); if(!msg) return; await sb.from('report_events').insert({report_id:id, type:'reply', content:msg, by_name:state.user.name}); await sb.from('reports').update({updated_at:new Date().toISOString()}).eq('id', id); closeModal(); renderApp(); };
  }
}

function viewReport(){
  $('appmain').innerHTML = `<h1 class="page-title">${t('reportTitle')}</h1><p class="page-sub">${t('reportSub')}</p><div class="card"><div class="row"><div class="field"><label>${t('fType')}</label><select id="rType">${['bully','cyber','emotion','harass','safety','family','other'].map(k=>`<option value="${k}">${t(TYPE_KEY[k])}</option>`).join('')}</select></div><div class="field"><label>${t('fSev')}</label><select id="rSev">${['low','mid','high','critical'].map(k=>`<option value="${k}" ${k==='mid'?'selected':''}>${t(SV_KEY[k])}</option>`).join('')}</select></div></div><div class="field"><label>${t('fDesc')} *</label><textarea id="rDesc" placeholder="${t('fDesc')}…"></textarea></div><div class="row"><div class="field"><label>${t('fPeople')} (${t('optional')})</label><input id="rPeople"></div><div class="field"><label>${t('fPlace')} (${t('optional')})</label><input id="rPlace"></div></div><div class="row"><div class="field"><label>${t('fCount')} (${t('optional')})</label><input id="rCount" inputmode="numeric"></div><div class="field"><label>${t('fClass')} (${t('optional')})</label><input id="rClass" value="${esc(state.user.className||'')}"></div></div><label style="display:flex;align-items:center;gap:9px;font-size:13.5px;margin:6px 0 18px;cursor:pointer"><input type="checkbox" id="rAnon" style="width:auto"> ${t('anonymous')}</label><div class="err" id="rErr"></div><button class="btn btn-primary" id="rSubmit">${t('submit')}</button></div>`;
  $('rSubmit').onclick = async ()=>{
    const desc = ($('rDesc').value||'').trim();
    if(!desc){ $('rErr').textContent = t('errFill'); return; }
    const code = 'VS-' + new Date().getFullYear() + '-' + Math.random().toString(36).slice(2,8).toUpperCase();
    const {data:inserted, error} = await sb.from('reports').insert({code, student_id:state.user.id, anonymous: $('rAnon').checked, type: $('rType').value, severity: $('rSev').value, description: desc, people: ($('rPeople').value||'').trim(), place: ($('rPlace').value||'').trim(), count: ($('rCount').value||'').trim(), class_name: ($('rClass').value||'').trim(), status:'pending'}).select().single();
    if(error){ $('rErr').textContent = error.message; return; }
    await sb.from('report_events').insert({report_id:inserted.id, type:'created', content:t('evCreated'), by_name:state.user.name});
    openModal(`<div style="text-align:center;padding:10px 0"><div style="font-size:52px">✅</div><h2 style="margin:12px 0 6px">${t('reportDone')}</h2><p style="color:var(--muted);font-size:13.5px;margin:0 0 16px">${t('yourCode')}</p><div style="font-family:ui-monospace,monospace;font-size:22px;font-weight:800;color:var(--accent2);background:rgba(34,211,238,.08);padding:14px;border-radius:12px;border:1px dashed rgba(34,211,238,.35)">${code}</div><button class="btn btn-primary btn-full" style="margin-top:20px" onclick="closeModal();state.view='mine';renderApp()">${t('navMine')}</button></div>`);
  };
}

function viewRes(){
  const items = [['🚨','999',state.lang==='zh'?'马来西亚紧急电话（警察 / 救护车 / 消防）':state.lang==='ms'?'Kecemasan Malaysia':'Malaysia emergency','999'],['💚','15999',state.lang==='zh'?'Talian Kasih · 24 小时免费求助热线':state.lang==='ms'?'Talian Kasih · 24 jam':'Talian Kasih · 24h toll-free','15999'],['🌙','03-7627 2929',state.lang==='zh'?'Befrienders KL · 24 小时情绪支援':state.lang==='ms'?'Befrienders KL · 24 jam':'Befrienders KL · 24h support','0376272929'],['🏫','',state.lang==='zh'?'学校辅导老师 / 训导处':state.lang==='ms'?'Kaunselor sekolah':'School counsellor','']];
  $('appmain').innerHTML = `<h1 class="page-title">${t('resTitle')}</h1><p class="page-sub">${t('resSub')}</p>${items.map(([ic,num,desc,tel])=>`<a href="${tel?`tel:${tel}`:'#'}" style="text-decoration:none;color:inherit"><div class="card" style="display:flex;gap:14px;align-items:center"><div style="font-size:26px">${ic}</div><div style="flex:1"><div style="font-weight:800;font-size:15px">${num || (state.lang==='zh'?'学校辅导老师':'School counsellor')}</div><div style="font-size:12.5px;color:var(--muted)">${desc}</div></div>${tel?`<div class="badge info">${t('resCall')}</div>`:''}</div></a>`).join('')}`;
}

let lockTimer=null;
async function testLockRemaining(){ const list = await fetchAssessments(state.user.id); if(!list.length) return 0; const last = new Date(list[0].created_at).getTime(); return Math.max(0, 12*60*60*1000 - (Date.now()-last)); }
async function viewTest(){
  const remain = await testLockRemaining();
  if(remain>0){
    const list = await fetchAssessments(state.user.id);
    $('appmain').innerHTML = `<h1 class="page-title">${t('testTitle')}</h1><p class="page-sub">${t('testSub')}</p><div class="lock-card card"><div class="ic">🔒</div><h3 style="margin:0 0 8px;font-size:17px">${t('testLocked')}</h3><div class="countdown" id="cd">--:--</div><p style="font-size:13px;color:var(--muted);margin:0 0 20px">${t('testLockNote')}</p><div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><button class="btn btn-ghost" id="viewLast">${t('viewLast')}</button><button class="btn btn-ghost" onclick="goHome()">${t('backHome')}</button></div></div>`;
    $('viewLast').onclick = ()=> showResult(list[0]);
    startCountdown(remain); return;
  }
  if(lockTimer){ clearInterval(lockTimer); lockTimer=null; }
  $('appmain').innerHTML = `<h1 class="page-title">${t('testTitle')}</h1><p class="page-sub">${t('testSub')}</p><div class="card" style="text-align:center;padding:40px 24px"><div style="font-size:52px;margin-bottom:14px">🧠</div><p style="font-size:14px;color:#c3d4ec;max-width:440px;margin:0 auto 24px;line-height:1.75">${t('forceMsg')}</p><button class="btn btn-primary" id="startTest">${t('testStart')}</button></div>`;
  $('startTest').onclick = startTest;
}
function goHome(){ state.view='home'; renderApp(); }
function startCountdown(ms){ let left = Math.floor(ms/1000); const el = $('cd'); const tick = ()=>{ if(!el) return; const m = Math.floor(left/60), s = left%60; el.textContent = String(m).padStart(2,'0')+':'+String(s).padStart(2,'0'); left--; if(left<0){ clearInterval(lockTimer); lockTimer=null; renderApp(); } }; tick(); lockTimer = setInterval(tick, 1000); }
async function startTest(){
  $('appmain').innerHTML = `<div class="card" style="text-align:center;padding:60px 24px"><div style="font-size:52px;margin-bottom:16px;animation:breathe 2s ease-in-out infinite">🧠</div><h3 style="margin:0 0 8px">${t('genTest')}</h3><p style="color:var(--muted);font-size:13.5px;margin:0">${t('pleaseWait')}</p><div class="spinner" style="margin-top:26px"></div></div>`;
  const questions = await generateTest();
  state.test = {questions, answers:[], index:0};
  renderTestQ();
}
function renderTestQ(){
  const T = state.test; const q = T.questions[T.index];
  const total = T.questions.length; const pct = Math.round((T.index/total)*100);
  const sel = T.answers[T.index];
  $('appmain').innerHTML = `<div class="card"><div class="test-prog"><i style="width:${pct}%"></i></div><div style="font-size:11.5px;color:var(--dim);margin-bottom:18px">${t('qOf')} ${T.index+1} / ${total}</div><div style="font-size:11.5px;color:var(--accent2);font-weight:700;letter-spacing:.5px;margin-bottom:8px">${DIM_ICON[q.dim]} ${esc(q.name)}</div><div style="font-size:18px;font-weight:700;line-height:1.5;margin-bottom:22px">${esc(q.q)}</div><div id="opts">${q.opts.map((o,i)=>`<div class="opt ${sel===i?'on':''}" data-i="${i}"><span class="dot"></span><span>${esc(o)}</span></div>`).join('')}</div><div style="display:flex;gap:10px;margin-top:22px"><button class="btn btn-ghost" id="tPrev" ${T.index===0?'disabled':''}>← ${t('prev')}</button><button class="btn btn-primary" id="tNext" style="flex:1" ${sel==null?'disabled':''}>${T.index===total-1?t('submitTest'):t('next')} →</button></div></div>`;
  $('opts').querySelectorAll('.opt').forEach(el=>{ el.onclick = ()=>{ T.answers[T.index] = parseInt(el.dataset.i,10); renderTestQ(); }; });
  $('tPrev').onclick = ()=>{ if(T.index>0){ T.index--; renderTestQ(); } };
  $('tNext').onclick = ()=>{ if(T.answers[T.index]==null) return; if(T.index===total-1) submitTest(); else { T.index++; renderTestQ(); } };
}
async function submitTest(){
  const T = state.test;
  $('appmain').innerHTML = `<div class="card" style="text-align:center;padding:60px 24px"><div style="font-size:52px;margin-bottom:16px;animation:breathe 2s ease-in-out infinite">📊</div><h3 style="margin:0 0 8px">${t('analyzing')}</h3><p style="color:var(--muted);font-size:13.5px;margin:0">${t('pleaseWait')}</p><div class="spinner" style="margin-top:26px"></div></div>`;
  await new Promise(r=>setTimeout(r, 800));
  const res = analyzeTest(T.questions, T.answers);
  const {data:inserted, error} = await sb.from('assessments').insert({student_id:state.user.id, student_name: state.user.name, class_name: state.user.className || '', total: res.total, max:60, level: res.level, label: res.label, dims: res.dims}).select().single();
  if(error){ alert(error.message); return; }
  state.lastResult = inserted; state.test = null;
  showResult(inserted);
}
function showResult(res){
  if(!res) return;
  const dims = res.dims || [];
  const bg = {good:'linear-gradient(135deg,rgba(34,197,94,.22),rgba(34,211,238,.08))',moderate:'linear-gradient(135deg,rgba(47,123,255,.22),rgba(34,211,238,.08))',low:'linear-gradient(135deg,rgba(255,176,32,.22),rgba(255,84,112,.08))',high:'linear-gradient(135deg,rgba(255,84,112,.24),rgba(200,30,60,.12))'}[res.level];
  const bd = {good:'rgba(34,197,94,.3)',moderate:'rgba(47,123,255,.3)',low:'rgba(255,176,32,.3)',high:'rgba(255,84,112,.4)'}[res.level];
  const dimRows = dims.map(d=>{ const col = d.score>=3?'#ff5470':d.score===2?'#ffb020':'#22c55e'; return `<div class="dim-row"><div class="dim-name">${DIM_ICON[d.dim]||'•'} ${esc(d.name)}</div><div class="dim-bar"><i style="width:${(d.score/3)*100}%;background:${col}"></i></div><div style="font-size:12px;font-weight:700;color:${col};min-width:28px;text-align:right">${d.score}/3</div></div>`; }).join('');
  const urgentNeeded = dims.some(d=>d.score>=3) || dims.some(d=>(d.dim==='bullying'||d.dim==='safety')&&d.score>=2);
  $('appmain').innerHTML = `<h1 class="page-title">${t('resultTitle')}</h1><p class="page-sub">${new Date(res.created_at||res.at).toLocaleString()}</p><div class="score-card" style="background:${bg};border:1px solid ${bd}"><div class="score-big">${res.total}<small> / 60</small></div><div style="font-size:18px;font-weight:800;margin-top:8px">${esc(res.label)}</div><div style="font-size:13px;color:#c3d4ec;margin-top:10px;line-height:1.7">${t('notDiag')}</div></div><div class="card"><h3>${t('dimBreak')}</h3>${dimRows}</div>${urgentNeeded?`<div class="card" style="background:linear-gradient(135deg,rgba(255,84,112,.18),rgba(200,30,60,.08));border-color:rgba(255,84,112,.45)"><h3 style="color:#ff8fa3">🚨 ${t('urgent')}</h3><div style="font-size:13.5px;line-height:2"><a href="tel:999" style="color:#e8f1ff;text-decoration:none">📞 999 — Emergency</a><br><a href="tel:15999" style="color:#e8f1ff;text-decoration:none">📞 15999 — Talian Kasih</a><br><a href="tel:0376272929" style="color:#e8f1ff;text-decoration:none">📞 03-7627 2929 — Befrienders KL</a></div></div>`:''}<div class="card"><h3>${t('advice')}</h3><div style="font-size:13.5px;color:#c3d4ec;line-height:1.8">${state.lang==='zh'?'1. 试着固定作息时间。<br>2. 每天找一个人说几句话。<br>3. 如果情绪持续低落超过两周，请找学校辅导老师聊聊。<br>4. 遇到霸凌或骚扰，请使用本 App 的举报功能。':state.lang==='ms'?'1. Tetapkan masa tidur yang tetap.<br>2. Bercakap dengan seseorang setiap hari.<br>3. Jika berterusan lebih dua minggu, jumpa kaunselor.<br>4. Jika dibuli, guna fungsi laporan.':'1. Keep a consistent sleep schedule.<br>2. Talk to one person each day.<br>3. If low mood lasts over two weeks, speak to the counsellor.<br>4. If bullied or harassed, use the report function.'}</div></div><div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:8px"><button class="btn btn-ghost" onclick="goHome()">${t('backHome')}</button><button class="btn btn-ghost" onclick="state.view='ai';renderApp()">🛡️ ${t('quickChat')}</button><button class="btn btn-ghost" onclick="state.view='report';renderApp()">📝 ${t('quickReport')}</button></div>`;
}
async function maybeForceTest(){
  if(state.user.role!=='student') return;
  if(state.forceShown) return;
  const remain = await testLockRemaining();
  if(remain>0) return;
  state.forceShown = true;
  setTimeout(()=>{ openModal(`<div style="text-align:center;padding:8px 0"><div style="font-size:48px">🧠</div><h2 style="margin:12px 0 10px">${t('forceTitle')}</h2><p style="font-size:13.5px;color:#c3d4ec;line-height:1.75;margin:0 0 22px">${t('forceMsg')}</p><div style="display:flex;gap:10px"><button class="btn btn-ghost" style="flex:1" onclick="closeModal()">${t('later')}</button><button class="btn btn-primary" style="flex:1" onclick="closeModal();state.view='test';renderApp()">${t('forceStart')}</button></div></div>`); }, 700);
}

async function viewDash(){
  const students = await fetchStudents();
  const rs = await fetchAllReports();
  const as = await fetchAssessments();
  const pending = rs.filter(r=>r.status==='pending').length;
  const done = rs.filter(r=>r.status==='resolved').length;
  const byType = {}; rs.forEach(r=>{ byType[r.type]=(byType[r.type]||0)+1; });
  const maxType = Math.max(1, ...Object.values(byType));
  const typeBars = Object.keys(byType).length ? Object.entries(byType).map(([k,v])=>`<div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px"><span>${t(TYPE_KEY[k]||'tOther')}</span><span style="color:var(--accent2);font-weight:700">${v}</span></div><div style="height:8px;background:rgba(90,140,220,.15);border-radius:99px;overflow:hidden"><div style="height:100%;width:${(v/maxType)*100}%;background:linear-gradient(90deg,#2f7bff,#22d3ee);border-radius:99px"></div></div></div>`).join('') : `<div style="color:var(--dim);font-size:13px">${t('noReports')}</div>`;
  $('appmain').innerHTML = `<h1 class="page-title">${t('dashTitle')}</h1><p class="page-sub">${t('dashSub')}</p><div class="stats"><div class="stat blue"><div class="n">${students.length}</div><div class="l">${t('navStudents')}</div></div><div class="stat yellow"><div class="n">${pending}</div><div class="l">${t('statPending')}</div></div><div class="stat green"><div class="n">${done}</div><div class="l">${t('statResolved')}</div></div><div class="stat red"><div class="n">${as.length}</div><div class="l">${t('navAssess')}</div></div></div><div class="card"><h3>${t('fType')}</h3>${typeBars}</div><div class="card"><h3>${t('recent')}</h3>${rs.length ? rs.slice(0,5).map(r=>`<div style="padding:10px 0;border-bottom:1px solid rgba(90,140,220,.09);font-size:13px"><span class="li-code">${esc(r.code)}</span><span class="badge ${stClass(r.status)}" style="margin-left:8px">${t(ST_KEY[r.status])}</span><div style="color:var(--muted);font-size:12px;margin-top:4px">${r.anonymous?'🕶️ Anonymous':esc(r.student_name||'Student')} · ${new Date(r.created_at).toLocaleString()}</div></div>`).join('') : `<div style="color:var(--dim);font-size:13px">${t('noReports')}</div>`}</div>`;
}
async function viewStudents(){
  const users = await fetchStudents();
  $('appmain').innerHTML = `<h1 class="page-title">${t('studentsTitle')}</h1><p class="page-sub">${t('studentsSub')}</p>${users.length ? `<div class="table-wrap"><table><thead><tr><th>${t('colName')}</th><th>${t('colEmail')}</th><th>${t('colClass')}</th><th>${t('colDate')}</th></tr></thead><tbody>${users.map(u=>`<tr><td style="font-weight:700;color:#e8f1ff">${esc(u.name)}</td><td>${esc(u.email)}</td><td>${esc(u.class_name||'—')}</td><td style="color:var(--dim);font-size:12px">${new Date(u.created_at).toLocaleDateString()}</td></tr>`).join('')}</tbody></table></div>` : emptyBox('👥', t('noStudents'))}`;
}
async function viewTeacherReports(){
  const rs = await fetchAllReports();
  $('appmain').innerHTML = `<h1 class="page-title">${t('reportsTitle')}</h1><p class="page-sub">${t('reportsSub')}</p>${rs.length ? rs.map(reportCard).join('') : emptyBox('📋', t('noReports'))}`;
  bindReportCards();
}
async function viewAssess(){
  const as = await fetchAssessments();
  $('appmain').innerHTML = `<h1 class="page-title">${t('assessTitle')}</h1><p class="page-sub">${t('assessSub')}</p>${as.length ? `<div class="table-wrap"><table><thead><tr><th>${t('colName')}</th><th>${t('colClass')}</th><th>${t('colScore')}</th><th>${t('colLevel')}</th><th>${t('colDate')}</th></tr></thead><tbody>${as.map(a=>{ const col = a.level==='good'?'#66e29a':a.level==='moderate'?'#7fb0ff':a.level==='low'?'#ffc76b':'#ff8fa3'; return `<tr><td style="font-weight:700;color:#e8f1ff">${esc(a.student_name)}</td><td>${esc(a.class_name||'—')}</td><td style="font-weight:800;color:${col}">${a.total}/60</td><td><span style="color:${col};font-weight:700;font-size:12.5px">${esc(a.label)}</span></td><td style="color:var(--dim);font-size:12px">${new Date(a.created_at).toLocaleString()}</td></tr>`; }).join('')}</tbody></table></div>` : emptyBox('🧠', t('noAssess'))}`;
}

function openModal(html){ $('modalBox').innerHTML = `<button class="icon-btn modal-close" onclick="closeModal()">✕</button>` + html; $('modal').classList.add('on'); }
function closeModal(){ $('modal').classList.remove('on'); }
$('modal').addEventListener('click', e=>{ if(e.target===$('modal')) closeModal(); });

async function boot(){
  state.verify = newVerify();
  const splashDelay = new Promise(r=>setTimeout(r, 1600));
  const sessionCheck = (async()=>{ const {data:{session}} = await sb.auth.getSession(); if(!session) return null; const {data:prof} = await sb.from('profiles').select('*').eq('id', session.user.id).single(); return prof; })();
  const [, prof] = await Promise.all([splashDelay, sessionCheck]);
  if(prof){ state.user = {id:prof.id, name:prof.name, email:prof.email, role:prof.role, className:prof.class_name}; await enterApp(); }
  else { showScreen('auth'); renderAuth(); }
}
boot();
